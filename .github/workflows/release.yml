name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Build the zip
        run: python scripts/build_zip.py

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/game-tape-review.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/game-tape-review.zip --title "$GITHUB_REF_NAME" \
              --notes 'Paste this line into your AI assistant: "Set up this skill and install it for me: https://github.com/TrellaceTeam/game-tape-review". To install by hand, see INSTALL.md.'
          fi
