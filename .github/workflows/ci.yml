name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Skill rules
        run: python scripts/check_skill.py skills/game-tape-review

      - name: Prose rules
        run: python scripts/lint_prose.py

      - name: Links
        run: python scripts/check_links.py

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: The zip builds with the right shape
        run: python scripts/build_zip.py

      # Python 3.9 is the python3 a Mac ships with. GitHub's Ubuntu 26.04 has no 3.9 build, so uv supplies it.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Scripts run on Python 3.9
        run: uv run --no-project --python 3.9 python -m unittest discover -s tests -v

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Skills CLI finds the skill
        env:
          DISABLE_TELEMETRY: "1"
          NO_COLOR: "1"
        run: |
          listing="$(npx -y skills@1.7.2 add . --list 2>&1)"
          echo "$listing"
          grep -q "game-tape-review" <<< "$listing" || { echo "skills CLI did not list game-tape-review"; exit 1; }
